<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Pin</title>
<style>
  :root { --bg: #f3f4f7; --surface: #fff; --ink: #1b1e26; --line: #dfe2e8; --ok: #1f9d6b;
          --shadow: 0 1px 2px rgba(20,24,40,.06), 0 12px 32px rgba(20,24,40,.08); }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1116; --surface: #181b22; --ink: #e9ebf0; --line: #2a2f3a; --ok: #3ccf91;
            --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.35); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px 16px; user-select: none;
  }
  .stage { display: flex; gap: 48px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .output {
    width: 100%; max-width: 340px; height: 56px; border-radius: 14px;
    background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
    display: flex; align-items: center; justify-content: center; position: relative;
    font: 500 26px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .32em;
    transition: border-color .3s, box-shadow .3s;
  }
  .output .val { padding-left: .32em; }
  .output .val:empty::before { content: "—"; color: var(--line); letter-spacing: 0; }
  .output.flash { border-color: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 18%, transparent), var(--shadow); }
  .output.flash .val { animation: settle .5s cubic-bezier(.2,.9,.3,1.3); }
  .output .check { position: absolute; right: 16px; width: 20px; height: 20px; opacity: 0; color: var(--ok);
    transform: scale(.4); transition: opacity .25s, transform .35s cubic-bezier(.2,.9,.3,1.4); }
  .output.flash .check { opacity: 1; transform: scale(1); }
  @keyframes settle { 0% { transform: translateY(14px); opacity: 0; } 100% { transform: none; opacity: 1; } }
  @media (max-width: 520px) { body .qp { --key: 64px; --gap: 16px; } }
</style>
</head>
<body>
<div class="stage">
  <div class="col">
    <div class="output" id="output">
      <span class="val" id="outVal"></span>
      <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </div>
    <div id="padHost"></div>
  </div>
  <div id="dialHost"></div>
</div>
<script src="../src/pad.js"></script>
<script src="knob.js"></script>
<script>
  const output = document.getElementById('output');
  const outVal = document.getElementById('outVal');
  let saved = 600;
  try { const s = parseInt(localStorage.getItem('quickpin.linger'), 10); if (s >= 120 && s <= 2000) saved = s; } catch (e) {}

  const pad = QuickPinPad.create(document.getElementById('padHost'), {
    linger: saved,
    onSubmit(pin) {
      outVal.textContent = pin;
      output.classList.remove('flash'); void output.offsetWidth; output.classList.add('flash');
      clearTimeout(output.t);
      output.t = setTimeout(() => output.classList.remove('flash'), 1400);
    },
  });
  QuickPinKnob.create(document.getElementById('dialHost'), {
    value: saved,
    onChange(ms) {
      pad.setLinger(ms);
      try { localStorage.setItem('quickpin.linger', ms); } catch (e) {}
    },
  });
</script>
</body>
</html>
